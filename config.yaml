# agentroundtable — model + run config
# Models are OpenRouter slugs: https://openrouter.ai/models
# Pick 4 debaters and 3 judges. Diversity across providers is recommended.

debate:
  rounds:
    - opening
    - rebuttal
    - closing
  research_results_per_debater: 8   # Brave results fetched per debater
  max_tokens_per_turn: 1600
  temperature_debater: 0.6
  temperature_judge: 0.2

debaters:
  - id: D1
    name: "Aria"
    model: "anthropic/claude-sonnet-4.5"
  - id: D2
    name: "Blaise"
    model: "openai/gpt-5"
  - id: D3
    name: "Chen"
    model: "google/gemini-2.5-pro"
  - id: D4
    name: "Dara"
    model: "meta-llama/llama-3.3-70b-instruct"

judges:
  - id: J1
    name: "Hon. Ito"
    model: "anthropic/claude-opus-4.5"
  - id: J2
    name: "Hon. Kovač"
    model: "openai/gpt-5"
  - id: J3
    name: "Hon. Ramos"
    model: "x-ai/grok-4"

pipeline:
  # Standard filter thresholds applied to each argument before it reaches judges.
  min_citations_per_argument: 2
  slop_phrases:
    - "it is important to note"
    - "in conclusion"
    - "as an ai"
    - "delve into"
    - "tapestry"
    - "navigating the complexities"
    - "in today's fast-paced world"
    - "ultimately"
    - "moreover, it's worth mentioning"
  # Max allowed slop-phrase hits per 1k tokens before a warning is attached.
  slop_warn_threshold_per_1k: 3
  # Judges with z-score beyond this flag the score as an outlier.
  outlier_z: 2.0
