# agentroundtable — model + run config
# Models are OpenRouter slugs: https://openrouter.ai/models
# 5 debaters + 3 Opus-4.7 judges, tuned to stay under $3 total for a test run.

debate:
  rounds:
    - opening
    - rebuttal
    - closing
  research_results_per_debater: 5   # Brave results fetched per debater (trimmed from 8 to shrink input)
  max_tokens_per_turn: 4000         # kimi-k2.6 reasoning chewed 2500 on its research memo alone — 4000 gives room
  max_tokens_per_judge: 4000        # Opus 4.7 reasoning + scorecard JSON (5 × 5 dims)
  temperature_debater: 0.1
  temperature_judge: 0.1

debaters:
  - id: D1
    name: "Rook"
    model: "x-ai/grok-4.20-multi-agent"
  - id: D2
    name: "Glen"
    model: "z-ai/glm-5.1"
  - id: D3
    name: "Grok"
    model: "x-ai/grok-4.20-multi-agent"
  - id: D4
    name: "Qwen"
    model: "qwen/qwen3.6-plus"
  - id: D5
    name: "Max"
    model: "minimax/minimax-m2.7"

judges:
  - id: J1
    name: "Hon. Ito"
    model: "anthropic/claude-opus-4.7"
  - id: J2
    name: "Hon. Kovač"
    model: "anthropic/claude-opus-4.7"
  - id: J3
    name: "Hon. Ramos"
    model: "anthropic/claude-opus-4.7"

pipeline:
  min_citations_per_argument: 2
  slop_phrases:
    - "it is important to note"
    - "in conclusion"
    - "as an ai"
    - "delve into"
    - "tapestry"
    - "navigating the complexities"
    - "in today's fast-paced world"
    - "ultimately"
    - "moreover, it's worth mentioning"
  slop_warn_threshold_per_1k: 3
  outlier_z: 2.0
